{% set name = "osdagbridge-core" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv
  entry_points:
    - osdagbridge-cli=osdagbridge_core.cli.__main__:main

requirements:
  host:
    - python >=3.12,<3.13
    - pip
    - setuptools >=61
    - wheel

  run:
    - python >=3.12,<3.13
    - pip
    - osdag
    - pythonocc-core
    - numpy >=1.21.0
    - scipy >=1.10.1
    - pandas >=1.5.0
    - matplotlib-base >=3.5
    - mplcursors
    - pillow
    - fiona
    - shapely
    - xarray
    - ifcopenshell
    - plotly
    - setu

test:
  imports:
    - osdagbridge_core
    - osdagbridge_core.core
    - osdagbridge_core.cli
    - ospgrillage

about:
  home: https://github.com/osdagbridge/OsdagBridge-Core
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: "Computational, analysis, and design engine for OsdagBridge steel bridges"

extra:
  recipe-maintainers:
    - garvit000