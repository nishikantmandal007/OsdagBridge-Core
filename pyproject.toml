[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osdagbridge-core"
version = "1.0.0"
description = "OsdagBridge Core - Computational, analysis and design engine for steel bridges (Headless / CLI / Web / Desktop)"
readme = "README.md"
license = { file = "LICENSE" }

authors = [
  { name = "Osdag", email = "contact-osdag@fossee.in" }
]

maintainers = [
  {name = "Garvit Singh Rathore"}
]

requires-python = ">=3.12,<3.13"

keywords = [
  "bridge",
  "steel",
  "structural engineering",
  "analysis",
  "IRC",
  "IS 800",
  "Osdag",
  "OpenSeesPy",
  "ospgrillage"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
]

# Runtime dependencies
dependencies = [
  "numpy>=1.21.0",
  "scipy>=1.10.1",
  "pandas>=1.5.0",
  "matplotlib>=3.5",
  "mplcursors",
  "Pillow",
  "fiona",
  "shapely",
  "xarray",
  "openseespy>=3.2.2.6",
  "opsvis>=1.0",
  "ifcopenshell",
  "plotly",
  "PyYAML",
  "click",
  "setu @ git+https://github.com/nishikantmandal007/setu.git@main",
  "osdag-core @ git+https://github.com/osdag-admin/osdag-core.git@main",
]

[project.optional-dependencies]
test = [
  "pytest>=6.2.2",
]


# Package data
[tool.setuptools.package-data]
osdagbridge_core = [
  "core/data/**/*",
  "core/reports/templates/**/*",
]
ospgrillage = [
  "mat_lib.json",
]

# setuptools config
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Entry points
[project.scripts]
osdagbridge-cli = "osdagbridge_core.cli.__main__:cli"
